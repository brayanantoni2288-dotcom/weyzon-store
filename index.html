<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEYZON STORE</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;color:#fff;
background:
radial-gradient(circle at 10% 20%,#006eff55,transparent 30%),
radial-gradient(circle at 90% 80%,#ff003c55,transparent 30%),
linear-gradient(135deg,#020205,#06132d,#160207);
min-height:100vh
}
header{text-align:center;padding:22px;background:#02040cdd;border-bottom:2px solid #168cff;box-shadow:0 0 25px #007bff55}
.logo{font-size:38px;font-weight:900;letter-spacing:3px;text-shadow:0 0 15px #168cff,0 0 20px #ff1744}
.logo span{color:#45baff}
header p{color:#fff;font-weight:bold}
button{
border:0;border-radius:10px;padding:11px 15px;margin:4px;
background:linear-gradient(135deg,#087cff,#253bdb);
color:white;font-weight:bold;cursor:pointer;
box-shadow:0 0 12px #007bff55
}
button:hover{filter:brightness(1.2)}
