<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEYZON STORE</title>

  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff8c00;
      margin-bottom: 10px;
    }

    .subtitulo {
      text-align: center;
      color: #ccc;
      margin-bottom: 25px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ff9d22;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #292929;
      color: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #ff8c00;
    }

    .paquetes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .paquete {
      background: #292929;
      border: 2px solid #444;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .paquete:hover {
      border-color: #ff8c00;
    }

    .paquete.activo {
      border-color: #ff8c00;
      background: #3a250f;
    }

    .diamantes {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    .precio {
      color: #ff9d22;
      margin-top: 5px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #ff8c00;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff7300;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info {
      background: #202020;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      color: #ccc;
      font-size: 14px;
    }

    .test {
      color: #ffd166;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔥 WEYZON STORE 🔥</h1>
  <div class="subtitulo">Recargas Free Fire</div>

  <div class="card">

    <div class="info">
      Selecciona tu paquete de diamantes.
    </div>

    <div class="paquetes">

      <div class="paquete activo" data-diamantes="100" data-precio="2.70">
        <div class="diamantes">💎 100</div>
        <div class="precio">S/ 2.70</div>
      </div>

      <div class="paquete" data-diamantes="300" data-precio="8.00">
        <div class="diamantes">💎 300</div>
        <div class="precio">S/ 8.00</div>
      </div>

      <div class="paquete" data-diamantes="500" data-precio="13.20">
        <div class="diamantes">💎 500</div>
        <div class="precio">S/ 13.20</div>
      </div>

      <div class="paquete" data-diamantes="1000" data-precio="24.20">
        <div class="diamantes">💎 1000</div>
        <div class="precio">S/ 24.20</div>
      </div>

      <div class="paquete" data-diamantes="2000" data-precio="48.60">
        <div class="diamantes">💎 2000</div>
        <div class="precio">S/ 48.60</div>
      </div>

      <div class="paquete" data-diamantes="6000" data-precio="121.00">
        <div class="diamantes">💎 6000</div>
        <div class="precio">S/ 121.00</div>
      </div>

    </div>

    <label>🆔 ID de Free Fire</label>
    <input
      type="text"
      id="playerId"
      placeholder="Ej: 123456789"
    >

    <label>👤 Nombre del jugador</label>
    <input
      type="text"
      id="playerName"
      placeholder="Nombre de tu cuenta"
    >

    <label>📧 Correo electrónico</label>
    <input
      type="email"
      id="email"
      value="test_user_12345@testuser.com"
    >

    <label>📱 Número de Yape</label>
    <input
      type="text"
      id="phone"
      maxlength="9"
      placeholder="111111111"
      value="111111111"
      inputmode="numeric"
    >

    <label>🔐 Código OTP de Yape</label>
    <input
      type="text"
      id="otp"
      maxlength="6"
      placeholder="123456"
      value="123456"
      inputmode="numeric"
    >

    <button id="btnPagar">
      💳 PAGAR CON YAPE
    </button>

    <div class="test">
      🧪 Modo de prueba de Mercado Pago
    </div>

    <div id="resultado"></div>

  </div>

</div>

<script>

  /* ==============================
     CONFIGURACIÓN
  ============================== */

  const API_URL =
    "https://weyzon-api.brayanantoni2288.workers.dev";

  /*
    PUBLIC KEY DE PRUEBA
  */
  const MP_PUBLIC_KEY =
    "TEST-ded7f9e5-e5a9-4ed3-97a6-73584ba87df1";

  const mp = new MercadoPago(MP_PUBLIC_KEY, {
    locale: "es-PE"
  });


  /* ==============================
     VARIABLES
  ============================== */

  let paqueteSeleccionado = "100";
  let precioSeleccionado = "2.70";


  /* ==============================
     SELECCIÓN DE PAQUETES
  ============================== */

  document.querySelectorAll(".paquete").forEach(paquete => {

    paquete.addEventListener("click", () => {

      document.querySelectorAll(".paquete")
        .forEach(p => p.classList.remove("activo"));

      paquete.classList.add("activo");

      paqueteSeleccionado =
        paquete.dataset.diamantes;

      precioSeleccionado =
        paquete.dataset.precio;

    });

  });


  /* ==============================
     MOSTRAR RESULTADO
  ============================== */

  function mostrarResultado(mensaje, correcto = false) {

    const resultado =
      document.getElementById("resultado");

    resultado.style.display = "block";

    resultado.style.background =
      correcto ? "#123d1c" : "#3d1515";

    resultado.style.color =
      correcto ? "#8cff9b" : "#ff8c8c";

    resultado.textContent = mensaje;

  }


  /* ==============================
     BOTÓN PAGAR
  ============================== */

  document
    .getElementById("btnPagar")
    .addEventListener("click", procesarPago);


  async function procesarPago() {

    const boton =
      document.getElementById("btnPagar");

    const playerId =
      document.getElementById("playerId")
        .value.trim();

    const playerName =
      document.getElementById("playerName")
        .value.trim();

    const email =
      document.getElementById("email")
        .value.trim();

    const phone =
      document.getElementById("phone")
        .value.trim();

    const otp =
      document.getElementById("otp")
        .value.trim();


    /* ==============================
       VALIDACIONES
    ============================== */

    if (!playerId) {
      mostrarResultado("❌ Ingresa tu ID de Free Fire.");
      return;
    }

    if (!playerName) {
      mostrarResultado("❌ Ingresa el nombre del jugador.");
      return;
    }

    if (!email) {
      mostrarResultado("❌ Ingresa un correo.");
      return;
    }

    if (!/^[0-9]{9}$/.test(phone)) {
      mostrarResultado(
        "❌ El número de Yape debe tener 9 dígitos."
      );
      return;
    }

    if (!/^[0-9]{6}$/.test(otp)) {
      mostrarResultado(
        "❌ El OTP debe tener 6 dígitos."
      );
      return;
    }


    boton.disabled = true;
    boton.textContent = "⏳ PROCESANDO...";


    try {

      /* ==============================
         CREAR TOKEN YAPE
      ============================== */

      const yape =
        mp.yape({
          otp: otp,
          phoneNumber: phone
        });


      const yapeToken =
        await yape.create();


      console.log("Respuesta Yape:", yapeToken);


      let tokenParaPago;


      if (typeof yapeToken === "string") {

        tokenParaPago = yapeToken;

      } else if (
        yapeToken &&
        yapeToken.id
      ) {

        tokenParaPago = yapeToken.id;

      } else {

        throw new Error(
          "Mercado Pago no devolvió un token Yape válido."
        );

      }


      /* ==============================
         ENVIAR AL WORKER
      ============================== */

      const respuesta =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              title:
                "Recarga Free Fire - " +
                paqueteSeleccionado +
                " diamantes",

              price:
                Number(precioSeleccionado),

              playerId:
                playerId,

              playerName:
                playerName,

              email:
                email,

              yapeToken:
                tokenParaPago

            })

          }
        );


      const texto =
        await respuesta.text();


      let datos;

      try {

        datos = JSON.parse(texto);

      } catch {

        datos = {
          error: texto
        };

      }


      console.log(
        "Respuesta Worker:",
        datos
      );


      /* ==============================
         ERROR
      ============================== */

      if (!respuesta.ok) {

        let mensaje =
          datos.message ||
          datos.error ||
          "No se pudo procesar el pago.";

        if (datos.cause) {

          mensaje +=
            "\n\nDetalle:\n" +
            JSON.stringify(
              datos.cause,
              null,
              2
            );

        }

        if (datos.status_detail) {

          mensaje +=
            "\n\nEstado: " +
            datos.status_detail;

        }

        throw new Error(mensaje);

      }


      /* ==============================
         PAGO APROBADO
      ============================== */

      mostrarResultado(
        "✅ PAGO PROCESADO CORRECTAMENTE\n\n" +
        "💎 Diamantes: " +
        paqueteSeleccionado +
        "\n" +
        "💰 Precio: S/ " +
        precioSeleccionado +
        "\n\n" +
        "🆔 ID Free Fire: " +
        playerId +
        "\n" +
        "👤 Jugador: " +
        playerName,
        true
      );


    } catch (error) {

      console.error(
        "Error completo:",
        error
      );


      mostrarResultado(
        "❌ NO SE PUDO PROCESAR EL PAGO:\n\n" +
        error.message
      );


    } finally {

      boton.disabled = false;

      boton.textContent =
        "💳 PAGAR CON YAPE";

    }

  }

</script>

</body>
</html>
