<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEYZON STORE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:#fff;
background:
radial-gradient(circle at 10% 20%,#0057ff55,transparent 25%),
radial-gradient(circle at 90% 80%,#ff003c55,transparent 28%),
linear-gradient(135deg,#020205,#050814 50%,#0d0106);
min-height:100vh
}

header{
padding:25px 15px;
text-align:center;
background:linear-gradient(135deg,#02030a,#071a3d,#19030b);
border-bottom:2px solid #168cff;
box-shadow:0 5px 25px #000
}

header h1{
margin:0;
font-size:34px;
color:#fff;
text-shadow:0 0 15px #168cff,0 0 25px #ff1744
}

header p{
margin:8px 0;
font-weight:bold
}

nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
padding:14px;
background:#05060b
}

button{
border:1px solid #42bfff66;
border-radius:10px;
padding:11px 15px;
background:linear-gradient(135deg,#086cff,#143fd0);
color:#fff;
font-weight:bold;
cursor:pointer
}

button:hover{
filter:brightness(1.15)
}

.red{
background:linear-gradient(135deg,#e21d2d,#8e0618)
}

.dark{
background:#151923
}

.wrap{
max-width:1100px;
margin:auto;
padding:22px 15px
}

.hidden{
display:none!important
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px
}

.card{
background:linear-gradient(145deg,#071a35ee,#081025ee);
border:1px solid #178dff99;
border-radius:16px;
padding:17px;
text-align:center;
box-shadow:0 0 18px #006eff22;
position:relative
}

.card h2{
margin:5px 0
}

.price{
font-size:24px;
font-weight:bold;
color:#65c4ff;
margin:10px 0;
text-shadow:0 0 10px #168cff
}

.warn{
font-size:12px;
color:#ffd76a;
background:#ff8c001c;
border:1px solid #ffb00088;
padding:9px;
border-radius:9px;
margin:10px 0
}

.stock{
font-size:12px;
color:#65ffbd;
margin:7px 0
}

.gateway{
margin:20px 0;
padding:16px;
border:1px solid #2a7dff;
border-radius:15px;
background:linear-gradient(135deg,#061733,#160717)
}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px
}

.tab{
background:#091a34;
border:1px solid #27558f
}

.tab.active{
background:linear-gradient(135deg,#00a8ff,#2256ff)
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
z-index:1000;
padding:20px;
overflow:auto
}

.box{
max-width:600px;
margin:40px auto;
background:linear-gradient(145deg,#07152b,#100817);
border:1px solid #2f9dff;
border-radius:18px;
padding:20px;
box-shadow:0 0 35px #007bff55
}

.close{
float:right;
background:#27334b
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #3579b8;
background:#050b16;
color:#fff
}

.order{
border:1px solid #2b69a8;
border-radius:12px;
padding:12px;
margin:10px 0;
background:#071224
}

.pending{
border-color:#ffb30099
}

.done{
border-color:#25e58b99
}

.ok{
color:#35ff98
}

.note{
padding:10px;
border-radius:10px;
background:#3b2105;
border:1px solid #ffb00088;
margin:10px 0
}

.admin-stat{
display:inline-block;
margin:5px;
padding:10px 12px;
border-radius:10px;
background:#0a2344;
border:1px solid #168cff66
}

#notify{
position:fixed;
right:15px;
bottom:15px;
z-index:9999;
background:linear-gradient(135deg,#063b9d,#6b0927);
border:1px solid #50cfff;
border-radius:14px;
padding:14px;
display:none;
box-shadow:0 0 25px #007bff66
}
</style>
</head>

<body>

<header>
<h1>💎 WEYZON STORE</h1>
<p>Recarga tus mejores diamantes aquí 🔥</p>
</header>

<nav>
<button onclick="mostrar('pasarela1')">💎 Pasarela 1</button>
<button class="red" onclick="mostrar('pasarela2')">🔥 Diamantes infinitos</button>
<button class="dark" onclick="misPedidos()">📋 Mis pedidos</button>
<button class="dark" onclick="adminLogin()">🔐 Admin</button>
</nav>

<div class="wrap">

<section id="pasarela1">
<div class="gateway">
<h2>💎 Pasarela 1</h2>
<p>Recargas de diamantes para Free Fire.</p>
</div>

<div id="productos1" class="grid"></div>
</section>

<section id="pasarela2" class="hidden">
<div class="gateway">
<h2>🔥 Diamantes infinitos</h2>
<p>Stock ilimitado • Cualquier ID</p>
</div>

<div id="productos2" class="grid"></div>
</section>

<section id="pedidos" class="hidden">
<div class="gateway">
<h2>📋 Mis pedidos</h2>
</div>

<div id="listaPedidos"></div>
</section>

<section id="admin" class="hidden">
<div class="gateway">
<h2>🔐 Panel administrador</h2>
<div id="estadisticas"></div>
</div>

<div id="listaAdmin"></div>
</section>

</div>

<div id="modal" class="modal">
<div class="box">

<button class="close" onclick="cerrar()">X</button>

<h2 id="modalTitulo">Nuevo pedido</h2>

<input id="ffid" type="text" placeholder="ID de Free Fire">

<div id="datosPedido"></div>

<button onclick="crearPedido()">✅ Confirmar pedido</button>

</div>
</div>

<div id="notify"></div>
<script>
const SUPABASE_URL="https://dwvlhdatthuedsjtrtna.supabase.co";
const SUPABASE_KEY="sb_publishable_K2lzpQJ9oj-fF-_VGtNdQw_4OSJ-nxX";

const PREXPE="963348614";
const WHATSAPP="51997456709";

const productos1=[
 {nombre:"100 💎",precio:2.30},
 {nombre:"300 💎",precio:7.00},
 {nombre:"500 💎",precio:10.00},
 {nombre:"1,000 💎",precio:20.00},
 {nombre:"2,000 💎",precio:40.00},
 {nombre:"6,000 💎",precio:95.00},
 {nombre:"Pase Booyah",precio:5.00}
];

const productos2=[
 {nombre:"100 💎",precio:3.30},
 {nombre:"300 💎",precio:9.40},
 {nombre:"500 💎",precio:14.30},
 {nombre:"1,000 💎",precio:25.34},
 {nombre:"2,000 💎",precio:53.00},
 {nombre:"3,000 💎",precio:75.00},
 {nombre:"6,000 💎",precio:128.00},
 {nombre:"Membresía básica",precio:2.00},
 {nombre:"Membresía semanal",precio:6.20},
 {nombre:"Membresía mensual",precio:31.00}
];

let pedidoActual=null;

function mostrar(id){
document.getElementById("pasarela1").classList.add("hidden");
document.getElementById("pasarela2").classList.add("hidden");
document.getElementById("pedidos").classList.add("hidden");
document.getElementById("admin").classList.add("hidden");

document.getElementById(id).classList.remove("hidden");

window.scrollTo({top:0,behavior:"smooth"});
}

function crearTarjetas(id,productos,pasarela){
const cont=document.getElementById(id);
cont.innerHTML="";

productos.forEach(function(p){

let warning="";

if(pasarela===1 && p.nombre!=="Pase Booyah"){
warning=`
<div class="warn">
⚠️ Antes de pagar, verifica si tu ID tiene descuento.
No se hace reembolso.
</div>`;
}

let stock="";

if(pasarela===2){
stock=`<div class="stock">🟢 Stock ilimitado</div>`;
}

cont.innerHTML+=`
<div class="card">
<h2>${p.nombre}</h2>

<div class="price">
S/ ${p.precio.toFixed(2)}
</div>

${stock}

${warning}

<button onclick="abrirPedido('${p.nombre}',${p.precio},${pasarela})">
🛒 Comprar
</button>
</div>
`;
});
}

function abrirPedido(producto,precio,pasarela){

pedidoActual={
producto:producto,
precio:precio,
pasarela:pasarela
};

document.getElementById("modalTitulo").textContent=
"💎 "+producto;

document.getElementById("datosPedido").innerHTML=`
<div class="status">
<p>💎 Producto: <b>${producto}</b></p>
<p>💰 Precio: <b>S/ ${precio.toFixed(2)}</b></p>
<p>⚡ Pasarela: <b>${pasarela}</b></p>
<p>💳 Prexpe: <b>${PREXPE}</b></p>
</div>

<div class="note">
📲 Después de pagar, envía tu comprobante por WhatsApp.
</div>

<button
onclick="window.open('https://wa.me/${WHATSAPP}?text='+encodeURIComponent('Hola WEYZON STORE, envío mi comprobante de pago. Producto: ${producto}'))">
📲 Enviar comprobante
</button>
`;

document.getElementById("modal").style.display="block";
}

function cerrar(){
document.getElementById("modal").style.display="none";
}

function guardarLocal(pedido){

let pedidos=[];

try{
pedidos=JSON.parse(
localStorage.getItem("weyzon_pedidos")||"[]"
);
}catch(e){
pedidos=[];
}

pedidos.push(pedido);

localStorage.setItem(
"weyzon_pedidos",
JSON.stringify(pedidos)
);
}

function cargarLocal(){

try{
return JSON.parse(
localStorage.getItem("weyzon_pedidos")||"[]"
);
}catch(e){
return [];
}

}

function mostrarAviso(texto){

const n=document.getElementById("notify");

n.textContent=texto;
n.style.display="block";

setTimeout(function(){
n.style.display="none";
},4000);

}

crearTarjetas(
"productos1",
productos1,
1
);

crearTarjetas(
"productos2",
productos2,
2
);
</script>
<script>
async function crearPedido(){

if(!pedidoActual){
return;
}

const ffid=document.getElementById("ffid").value.trim();

if(!ffid){
alert("⚠️ Ingresa tu ID de Free Fire.");
return;
}

const boton=document.getElementById("btnCrearPedido");

boton.disabled=true;
boton.textContent="⏳ Creando pedido...";

const pedido={
ffid:ffid,
producto:pedidoActual.producto,
precio:pedidoActual.precio,
pasarela:pedidoActual.pasarela,
estado:"Pendiente"
};

try{

const respuesta=await fetch(
SUPABASE_URL+"/rest/v1/pedidos",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation"
},

body:JSON.stringify(pedido)
}
);

if(!respuesta.ok){

const error=await respuesta.text();

console.error(error);

throw new Error("No se pudo crear el pedido.");
}

const datos=await respuesta.json();

guardarLocal({
...pedido,
id:datos[0]?.id||Date.now(),
creado_en:new Date().toISOString()
});

mostrarAviso("✅ Pedido creado correctamente.");

document.getElementById("modal").style.display="none";

document.getElementById("ffid").value="";

mostrar("pedidos");

mostrarMisPedidos();

}catch(error){

console.error(error);

alert(
"❌ No se pudo crear el pedido.\n\n"+
"Verifica tu conexión e inténtalo nuevamente."
);

}finally{

boton.disabled=false;
boton.textContent="💎 Crear pedido";

}

}


function mostrarMisPedidos(){

const cont=document.getElementById("listaPedidos");

if(!cont){
return;
}

const pedidos=cargarLocal();

if(pedidos.length===0){

cont.innerHTML=`
<div class="empty">
📭 Todavía no tienes pedidos.
</div>
`;

return;
}

cont.innerHTML="";

pedidos.slice().reverse().forEach(function(p){

let estado="🟡 Pendiente";

if(p.estado==="Completado"){
estado="✅ Completado";
}

cont.innerHTML+=`
<div class="order">

<h3>💎 ${p.producto}</h3>

<p>👤 ID: <b>${p.ffid}</b></p>

<p>💰 Precio:
<b>S/ ${Number(p.precio).toFixed(2)}</b>
</p>

<p>⚡ Pasarela:
<b>${p.pasarela}</b>
</p>

<p>📌 Estado:
<b>${estado}</b>
</p>

</div>
`;

});

}


async function iniciarAdmin(){

const email=document.getElementById("adminEmail").value.trim();

const password=document.getElementById("adminPassword").value;

if(!email||!password){

alert("⚠️ Ingresa tu correo y contraseña.");

return;
}

const boton=document.getElementById("btnAdminLogin");

boton.disabled=true;
boton.textContent="⏳ Iniciando...";

try{

const respuesta=await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const datos=await respuesta.json();

if(!respuesta.ok){

throw new Error(
datos.error_description||
"Correo o contraseña incorrectos."
);

}

localStorage.setItem(
"weyzon_admin_token",
datos.access_token
);

localStorage.setItem(
"weyzon_admin_email",
email
);

document.getElementById("adminLogin").style.display="none";

document.getElementById("adminPanel").style.display="block";

cargarPedidosAdmin();

mostrarAviso("🔐 Sesión de administrador iniciada.");

}catch(error){

alert("❌ "+error.message);

}finally{

boton.disabled=false;
boton.textContent="🔐 Entrar al panel";

}

}


function cerrarAdmin(){

localStorage.removeItem("weyzon_admin_token");
localStorage.removeItem("weyzon_admin_email");

document.getElementById("adminPanel").style.display="none";

document.getElementById("adminLogin").style.display="block";

document.getElementById("adminEmail").value="";
document.getElementById("adminPassword").value="";

}


async function cargarPedidosAdmin(){

const token=localStorage.getItem("weyzon_admin_token");

if(!token){

return;
}

const cont=document.getElementById("adminPedidos");

if(!cont){

return;
}

cont.innerHTML=`
<div class="empty">
⏳ Cargando pedidos...
</div>
`;

try{

const respuesta=await fetch(
SUPABASE_URL+
"/rest/v1/pedidos?select=*&order=creado_en.desc",
{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token
}
}
);

if(!respuesta.ok){

if(respuesta.status===401){

cerrarAdmin();

alert("⚠️ La sesión del administrador expiró.");

return;

}

throw new Error("No se pudieron cargar los pedidos.");

}

const pedidos=await respuesta.json();

mostrarPedidosAdmin(pedidos);

}catch(error){

console.error(error);

cont.innerHTML=`
<div class="empty">
❌ Error al cargar los pedidos.
</div>
`;

}

}


function mostrarPedidosAdmin(pedidos){

const cont=document.getElementById("adminPedidos");

if(!pedidos.length){

cont.innerHTML=`
<div class="empty">
📭 No hay pedidos todavía.
</div>
`;

actualizarEstadisticas([]);

return;

}

cont.innerHTML="";

pedidos.forEach(function(p){

const completado=p.estado==="Completado";

let fecha="";

if(p.creado_en){

fecha=new Date(p.creado_en).toLocaleString(
"es-PE"
);

}

let entrega="";

if(p.entregado_en){

entrega=
new Date(p.entregado_en).toLocaleString(
"es-PE"
);

}

cont.innerHTML+=`
<div class="adminOrder">

<div class="adminTop">

<strong>💎 ${p.producto}</strong>

<span class="${
completado
?"done"
:"pending"
}">
${completado?"✅ Completado":"🟡 Pendiente"}
</span>

</div>

<p>👤 ID Free Fire:
<b>${p.ffid}</b>
</p>

<p>💰 Precio:
<b>S/ ${Number(p.precio).toFixed(2)}</b>
</p>

<p>⚡ Pasarela:
<b>${p.pasarela}</b>
</p>

<p>📅 Pedido:
${fecha}
</p>

${
entrega
?
`<p>💎 Entregado: ${entrega}</p>`
:""
}

${
!completado
?
`
<button
class="deliver"
onclick="marcarEntregado(${p.id})">
💎 Diamantes enviados
</button>
`
:
`
<div class="delivered">
✅ Pedido entregado
</div>
`
}

</div>
`;

});

actualizarEstadisticas(pedidos);

}


function actualizarEstadisticas(pedidos){

const total=pedidos.length;

const pendientes=pedidos.filter(
p=>p.estado!=="Completado"
).length;

const completados=pedidos.filter(
p=>p.estado==="Completado"
).length;

const totalEl=document.getElementById("statTotal");
const pendingEl=document.getElementById("statPending");
const doneEl=document.getElementById("statDone");

if(totalEl) totalEl.textContent=total;
if(pendingEl) pendingEl.textContent=pendientes;
if(doneEl) doneEl.textContent=completados;

}
</script>
<script>

async function marcarEntregado(id){

const token=localStorage.getItem("weyzon_admin_token");

if(!token){

alert("⚠️ Inicia sesión como administrador.");

return;

}

const confirmar=confirm(
"¿Confirmas que los diamantes ya fueron enviados?"
);

if(!confirmar){
return;
}

try{

const respuesta=await fetch(
SUPABASE_URL+
"/rest/v1/pedidos?id=eq."+id,
{
method:"PATCH",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token,
"Content-Type":"application/json",
"Prefer":"return=representation"
},

body:JSON.stringify({
estado:"Completado",
entregado_en:new Date().toISOString()
})
}
);

if(!respuesta.ok){

const error=await respuesta.text();

console.error(error);

throw new Error(
"No se pudo actualizar el pedido."
);

}

actualizarPedidoLocal(id);

mostrarAviso(
"💎 Pedido marcado como entregado."
);

cargarPedidosAdmin();

}catch(error){

console.error(error);

alert(
"❌ No se pudo marcar el pedido como entregado."
);

}

}


function actualizarPedidoLocal(id){

let pedidos=cargarLocal();

pedidos=pedidos.map(function(p){

if(String(p.id)===String(id)){

return {
...p,
estado:"Completado",
entregado_en:new Date().toISOString()
};

}

return p;

});

localStorage.setItem(
"weyzon_pedidos",
JSON.stringify(pedidos)
);

}


function buscarPedidoAdmin(){

const texto=document
.getElementById("buscarAdmin")
.value
.trim()
.toLowerCase();

const pedidos=document.querySelectorAll(
".adminOrder"
);

pedidos.forEach(function(pedido){

if(!texto){

pedido.style.display="block";

return;

}

const contenido=
pedido.textContent.toLowerCase();

pedido.style.display=
contenido.includes(texto)
?"block"
:"none";

});

}


function revisarSesionAdmin(){

const token=
localStorage.getItem("weyzon_admin_token");

const email=
localStorage.getItem("weyzon_admin_email");

if(token&&email){

const login=
document.getElementById("adminLogin");

const panel=
document.getElementById("adminPanel");

if(login){
login.style.display="none";
}

if(panel){
panel.style.display="block";
}

cargarPedidosAdmin();

}

}


async function actualizarPanel(){

const token=
localStorage.getItem("weyzon_admin_token");

if(!token){

alert("⚠️ Inicia sesión primero.");

return;

}

mostrarAviso("🔄 Actualizando pedidos...");

await cargarPedidosAdmin();

}


function enviarWhatsAppPedido(){

const telefono=WHATSAPP;

const mensaje=
"Hola WEYZON STORE 👋%0A"+
"Quiero consultar mi pedido.";

window.open(
"https://wa.me/"+
telefono+
"?text="+mensaje,
"_blank"
);

}


document.addEventListener(
"DOMContentLoaded",
function(){

const botonPedido=
document.getElementById(
"btnCrearPedido"
);

if(botonPedido){

botonPedido.addEventListener(
"click",
crearPedido
);

}

const botonLogin=
document.getElementById(
"btnAdminLogin"
);

if(botonLogin){

botonLogin.addEventListener(
"click",
iniciarAdmin
);

}

mostrarMisPedidos();

revisarSesionAdmin();

}
);

</script>
</script>

</body>
</html>
