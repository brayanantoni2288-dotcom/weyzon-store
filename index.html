<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEYZON STORE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#071a33 0%,#0b2b52 42%,#071a33 100%);color:#eaf4ff;min-height:100vh}
header{background:rgba(4,18,38,.96);color:white;border-bottom:1px solid #1e5fa8;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:800;letter-spacing:.5px}.logo span{color:#3b82f6}
.cart{background:#2563eb;border:0;color:white;padding:10px 15px;border-radius:10px;cursor:pointer}
.hero{padding:60px 7%;background:radial-gradient(circle at 85% 20%,#3b82f655 0,transparent 35%),linear-gradient(135deg,#06162b,#0b4f91,#123a70);color:white;border-bottom:1px solid #1d5c9d;box-shadow:0 12px 40px #00152e88}
.hero h1{font-size:42px;margin-bottom:10px}.hero p{font-size:18px;opacity:.9}
main{padding:40px 7%;background:radial-gradient(circle at 15% 20%,#1683ff14 0,transparent 30%),transparent}.title{margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:linear-gradient(145deg,#0d315a,#092746);border:1px solid #2477c455;border-radius:18px;padding:22px;box-shadow:0 8px 28px #00000045;transition:.2s;color:#eaf4ff}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 34px #00000055;border-color:#3b9cff88}
.icon{font-size:32px;margin-bottom:10px}.card h3{margin-bottom:8px;color:#fff}.card p{color:#b9d8f7}
.price{font-size:25px;font-weight:800;margin:15px 0;color:#69b7ff}
.buy,.primary{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
.buy:hover,.primary:hover{background:#1d4ed8}
.secondary{width:100%;padding:12px;border:0;border-radius:10px;background:#e5e7eb;color:#172033;font-weight:bold;cursor:pointer;margin-top:8px}
.wa{width:100%;padding:12px;border:0;border-radius:10px;background:#16a34a;color:white;font-weight:bold;cursor:pointer;margin-top:8px}
footer{text-align:center;padding:30px;color:#8fb5d8;background:#06182e;border-top:1px solid #1d568d}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:20;overflow:auto}
.box{background:linear-gradient(145deg,#06182d,#04101f);color:#eef8ff;border:1px solid #3184c966;border-radius:18px;padding:25px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #00000088}
.box h2{margin-bottom:15px}.close{float:right;border:0;background:none;color:#fff;font-size:22px;cursor:pointer}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #3d76a8;background:#071d36;color:#fff;border-radius:9px;outline:none}
input:focus{border-color:#4aa7ff;box-shadow:0 0 0 3px #3184c933}
.notice{margin-top:12px;font-size:13px;color:#b9d8f7}
.summary{background:#071d36;border:1px solid #2a6ea855;border-radius:12px;padding:14px;margin:12px 0;line-height:1.6}
.payment{display:none;margin-top:15px;background:linear-gradient(145deg,#06182d,#081f3a);border:1px solid #3b82f6;border-radius:14px;padding:18px;color:#eef8ff;box-shadow:0 10px 35px #0008}
.payment h3{margin-bottom:8px;color:#fff}
.yape-number{font-size:22px;font-weight:800;margin:10px 0;color:#fff}
.qr{width:230px;height:230px;object-fit:contain;display:flex;align-items:center;justify-content:center;text-align:center;margin:12px auto;border-radius:10px;background:#fff;color:#172033;font-weight:bold}
.status{margin-top:12px;background:#3a2410;border:1px solid #b45309;border-radius:10px;padding:12px;color:#fed7aa}
.order-box{background:#071d36;color:#eef8ff;border:1px solid #2a6ea8;border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 4px 14px #00000055}
.order-actions button{padding:9px 12px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:8px}
.complete{background:#16a34a;color:white}.pending{background:#f59e0b;color:white}
.admin{margin-top:18px}
hr{border:0;border-top:1px solid #e5e7eb;margin:18px 0}
.small{font-size:12px;color:#b9d8f7}
.feature-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:25px 0}
.feature-btn{padding:13px;border:1px solid #2563eb;background:#0a2340;color:#fff;border-radius:12px;font-weight:bold;cursor:pointer}
.feature-btn:hover{background:#123b68}
.copy-yape{background:#2563eb;color:white;border:0;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;margin-left:8px}
.status-good{background:#082b1d;color:#bbf7d0;border:1px solid #16a34a;border-radius:10px;padding:12px;margin-top:10px}
.search-order{margin-top:10px}
.product-warning{margin:10px 0;padding:9px 10px;border-radius:9px;background:#3a2410;border:1px solid #b45309;color:#ffd9a3;font-size:12px;line-height:1.4}
.product-warning b{color:#fff}
</style>
</head>

<body>

<header>
<div class="logo">WEYZON <span>STORE</span></div>

</header>

<h1>Recargas rápidas y seguras</h1>

<button class="feature-btn" onclick="contactWhatsApp()">💬 WhatsApp 997456709</button>
<button class="feature-btn" onclick="openGroup()">👥 Grupo</button>
</div>

<h2 class="title">💎 Diamantes Free Fire</h2>

<div class="grid" id="products">

<div class="icon">💎</div>
<h3>100 💎</h3>
<p>Recarga Free Fire</p>
