/* ==============================

============================== */

function showGateway(n){

currentGateway = n;

["gateway1","gateway2"].forEach((x,i)=>{

const el = $(x);

if(el){
el.classList.toggle("hidden",i !== n-1);
}

});

$("tab1").classList.toggle("active",n===1);

if($("tab2"))
$("tab2").classList.toggle("active",n===2);

}


/* ==============================
   PRODUCTOS
============================== */

function renderProducts(){

const box = $("products");

if(!box) return;

box.innerHTML = "";

const list =
currentGateway === 1
? gateway1
: gateway2;

const title =
document.createElement("div");

title.className = "section-title";

title.textContent =
currentGateway === 1
? "💎 Diamantes · Pasarela 1"
: "⚡ Diamantes infinitos · Pasarela 2";

box.appendChild(title);

list.forEach((p,i)=>{
addCard(p,false,i);
});

const t =
document.createElement("div");

t.className = "section-title";

t.textContent = "👑 Membresías";

box.appendChild(t);

memberships.forEach((p,i)=>{
addCard(p,true,i);
});

}


/* ==============================
   TARJETAS
============================== */

function addCard(p,isMembership,i){

const d =
document.createElement("div");

d.className =
"card" +
(isMembership ? " membership" : "");

const warning =
(!isMembership && currentGateway === 1)
?
`<div class="warn">
⚠️ Antes de pagar, verifica si tu ID tiene descuento.
No se hace reembolso.
</div>`
:
"";

const stock =
currentGateway === 2
?
`<div class="stock">
♾️ Stock ilimitado · Cualquier ID
</div>`
:
`<div class="stock">
⚡ Entrega después de verificar el pago
</div>`;

d.innerHTML = `

<h2>
${isMembership ? "👑 " : "💎 "}
${p[0]}
</h2>

<div class="price">
S/ ${p[1]}
</div>

${stock}

${warning}

<button>
Comprar por S/ ${p[1]}
</button>

d.querySelector("button")
.addEventListener("click",()=>{

selectProduct(
p[0],
p[1],
currentGateway,
isMembership
);

function boxAppend(d){

$("products").appendChild(d);

}


/* ==============================
   SELECCIONAR PRODUCTO
============================== */

function selectProduct(
name,
amount,
gateway,
isMembership
){

selected = {
name:name,
amount:Number(amount),
gateway:Number(gateway),
isMembership:!!isMembership
};

$("summary").innerHTML = `

<p>
<b>💎 Producto:</b>
${name}

<br><br>

<b>💰 Precio:</b>
S/ ${Number(amount).toFixed(2)}

<br><br>

<b>⚡ Pasarela:</b>
${gateway === 1
? "Pasarela 1"
: "Pasarela 2"}

</p>

`;

$("ffid").value = "";

$("orderModal").style.display = "block";

}


/* ==============================
   GENERAR CÓDIGO
============================== */

function generarCodigo(){

return "WZ-" +
crypto.randomUUID()
.replace(/-/g,"")
.substring(0,12)
.toUpperCase();

}


/* ==============================
   CREAR PEDIDO
============================== */

async function createOrder(){

if(!selected){

alert("⚠️ Primero selecciona un producto.");

return;

}

const id =
$("ffid").value.trim();

if(!id){

alert("⚠️ Ingresa tu ID de Free Fire.");

$("ffid").focus();

return;

}

const boton =
$("orderModal").querySelector("button:not(.close)");

if(boton){

boton.disabled = true;

boton.textContent =
"⏳ Creando pedido...";

}

try{

const codigo =
generarCodigo();

const clienteToken =
crypto.randomUUID();

const pedido = {

cliente_token: clienteToken,

codigo_pedido: codigo,

ffid: id,

producto: selected.name,

precio: Number(selected.amount),

pasarela: Number(selected.gateway),

estado: "Pendiente"

};

console.log("Enviando pedido:",pedido);

const respuesta =
await fetch(
SUPABASE_URL + "/rest/v1/pedidos",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation"
},

body:JSON.stringify(pedido)

}
);

const texto =
await respuesta.text();

let datos;

try{
datos = JSON.parse(texto);
}catch{
datos = texto;
}

console.log("Respuesta Supabase:",datos);

if(!respuesta.ok){

throw new Error(
typeof datos === "string"
? datos
: JSON.stringify(datos)
);

}


/* GUARDAR CÓDIGO */

localStorage.setItem(
"weyzon_codigo_cliente",
codigo
);

localStorage.setItem(
"weyzon_cliente_token",
clienteToken
);


/* GUARDAR PEDIDO LOCALMENTE COMO RESPALDO */

order = {

id:id,

product:selected.name,

amount:Number(selected.amount),

gateway:
selected.gateway === 1
? "Pasarela 1"
: "Pasarela 2",

type:
selected.isMembership
? "Membresía"
: "Diamantes",

code:codigo,

status:"Pendiente",

createdAt:
new Date().toLocaleString("es-PE")

};

let pedidosLocales =
JSON.parse(
localStorage.getItem("wzorders") || "[]"
);

pedidosLocales.push(order);

localStorage.setItem(
"wzorders",
JSON.stringify(pedidosLocales)
);


/* MOSTRAR PAGO */

$("payment").innerHTML = `

<p>

<b>📦 Código:</b>
${codigo}

<br><br>

<b>💎 Producto:</b>
${selected.name}

<br><br>

<b>💰 Monto:</b>
S/ ${Number(selected.amount).toFixed(2)}

<br><br>

<b>🎮 ID Free Fire:</b>
${id}

<br><br>

<b>⚡ Pasarela:</b>
${selected.gateway}

</p>

<div class="status">

🟡 <b>Pedido pendiente</b>

<br><br>

Guarda tu código:

<br>

<b>${codigo}</b>

<br><br>

Podrás usarlo para consultar tu pedido.

</div>

`;

$("orderModal").style.display = "none";

$("payModal").style.display = "block";

showNotify(
"✅ Pedido creado correctamente. Código: "+codigo
);

}catch(error){

console.error("ERROR CREANDO PEDIDO:",error);

alert(
"❌ Algo salió mal.\n\n"+
error.message
);

}finally{

if(boton){

boton.disabled = false;

boton.textContent =
"Continuar al pago";

}

}

}


/* ==============================
   WHATSAPP
============================== */

function sendProof(){

if(!order){

alert(
"⚠️ Primero crea un pedido."
);

return;

}

const mensaje =

/* ==============================
   COPIAR PREXPE
============================== */

function copyNum(){

if(navigator.clipboard){

navigator.clipboard.writeText(PREXPE);

}

showNotify(
"📋 Prexpe copiado: "+PREXPE
);

}


/* ==============================
   NOTIFICACIONES
============================== */

function showNotify(text){

const n = $("notify");

if(!n) return;

n.textContent = text;

n.style.display = "block";

clearTimeout(window.nt);

window.nt =
setTimeout(()=>{

n.style.display = "none";

},4500);

}


/* ==============================
   MIS PEDIDOS
============================== */

async function openOrders(){

const codigo =
localStorage.getItem(
"weyzon_codigo_cliente"
);

if(!codigo){

$("orders").innerHTML =
"<p>📭 No tienes pedidos todavía.</p>";

$("ordersModal").style.display = "block";

return;

}

try{

const respuesta =
await fetch(
SUPABASE_URL+
"/rest/v1/rpc/consultar_pedido",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
codigo:codigo
})

}
);

const datos =
await respuesta.json();

if(!respuesta.ok){

throw new Error(
JSON.stringify(datos)
);

}

if(!datos.length){

$("orders").innerHTML =
"<p>❌ No se encontró el pedido.</p>";

}else{

const o = datos[0];

$("orders").innerHTML = `

<div class="order ${
o.estado === "Completado"
? "done"
: "pending"
}">

<b>📦 ${o.producto}</b>

<br><br>

💰 S/ ${o.precio}

<br>

🎮 ID: ${o.ffid}

<br>

📦 Pedido: ${o.codigo_pedido}

<br>

⚡ Pasarela: ${o.pasarela}

<br>

Estado:

<b>
${
o.estado === "Completado"
? "✅ Completado"
: "🟡 Pendiente"
}
</b>

<br>

📅 Creado:
${formatearFecha(o.creado_en)}

${
o.entregado_en
?
`<br>💎 Entregado:
${formatearFecha(o.entregado_en)}`
:
""
}

</div>

`;

}

$("ordersModal").style.display = "block";

}catch(error){

console.error(error);

$("orders").innerHTML =
"<p>❌ No se pudo consultar el pedido.</p>";

$("ordersModal").style.display =
"block";

}

}


/* ==============================
   ADMIN LOGIN SUPABASE
============================== */

async function loginAdmin(){

const password =
$("adminPass").value.trim();

if(!password){

alert(
"⚠️ Ingresa tu contraseña."
);

return;

}

try{

const respuesta =
await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":
"application/json"
},

body:JSON.stringify({

email:ADMIN_EMAIL,

password:password

})

}
);

const datos =
await respuesta.json();

if(!respuesta.ok){

throw new Error(
datos.error_description ||
"Contraseña incorrecta."
);

}

adminToken =
datos.access_token;

localStorage.setItem(
"weyzon_admin_token",
adminToken
);

$("adminLogin").style.display =
"none";

$("adminModal").style.display =
"block";

renderAdmin();

showNotify(
"🔐 Panel administrador conectado."
);

}catch(error){

console.error(error);

alert(
"❌ No se pudo iniciar sesión.\n\n"+
error.message
);

}

}


/* ==============================
   ADMIN
============================== */

function openAdmin(){

if(adminToken){

renderAdmin();

$("adminModal").style.display =
"block";

return;

}

$("adminPass").value = "";

$("adminLogin").style.display =
"block";

$("adminModal").style.display =
"block";

}


/* ==============================
   PEDIDOS ADMIN
============================== */

async function renderAdmin(){

if(!adminToken){

return;

}

try{

const respuesta =
await fetch(

SUPABASE_URL+
"/rest/v1/pedidos?select=*&order=creado_en.desc",

{

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+adminToken
}

}

);

const datos =
await respuesta.json();

if(!respuesta.ok){

throw new Error(
JSON.stringify(datos)
);

}

const pending =
datos.filter(
x=>x.estado !== "Completado"
).length;

const done =
datos.filter(
x=>x.estado === "Completado"
).length;

$("adminBadge").innerHTML =
pending
? `<span class="badge">${pending}</span>`
: "";

$("adminStats").innerHTML = `

<span class="admin-stat">
📦 Pedidos: <b>${datos.length}</b>
</span>

<span class="admin-stat">
⏳ Pendientes: <b>${pending}</b>
</span>

<span class="admin-stat">
✅ Entregados: <b>${done}</b>
</span>

`;

$("adminOrders").innerHTML =
datos.length
?
datos.map(o=>`

<div class="order ${
o.estado === "Completado"
? "done"
: "pending"
}">

<b>📦 ${o.producto}</b>

<br><br>

📦 Código:
<b>${o.codigo_pedido}</b>

<br>

🎮 ID:
${o.ffid}

<br>

💰 S/ ${o.precio}

<br>

⚡ Pasarela:
${o.pasarela}

<br>

📅 Creado:
${formatearFecha(o.creado_en)}

<br>

Estado:
<b>
${
o.estado === "Completado"
? "✅ Completado"
: "🟡 Pendiente"
}
</b>

<br><br>

${
o.estado !== "Completado"

?

`<button onclick="adminComplete(${o.id})">
💎 Diamantes enviados
</button>`

:

`<span style="color:#61ffb0;font-weight:bold">
✅ Entrega registrada
</span>`

}

</div>

`).join("")

:

"<p>📭 No hay pedidos registrados.</p>";

}catch(error){

console.error(error);

$("adminOrders").innerHTML =
"<p>❌ No se pudieron cargar los pedidos.</p>";

}

}


/* ==============================
   MARCAR COMPLETADO
============================== */

async function adminComplete(id){

if(!adminToken){

alert(
"❌ Inicia sesión como administrador."
);

return;

}

if(!confirm(
"¿Confirmas que los diamantes ya fueron enviados?"
)){

return;

}

try{

const respuesta =
await fetch(

SUPABASE_URL+
"/rest/v1/pedidos?id=eq."+id,

{

method:"PATCH",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+adminToken,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:JSON.stringify({

estado:"Completado",

entregado_en:
new Date().toISOString()

})

}

);

if(!respuesta.ok){

const error =
await respuesta.text();

throw new Error(error);

}

showNotify(
"💎 Pedido marcado como completado."
);

renderAdmin();

}catch(error){

console.error(error);

alert(
"❌ No se pudo actualizar.\n\n"+
error.message
);

}

}


/* ==============================
   CERRAR MODAL
============================== */

function closeModal(id){

const elemento = $(id);

if(elemento){

elemento.style.display =
"none";

}

}


/* ==============================
   FECHA
============================== */

function formatearFecha(fecha){

if(!fecha) return "-";

return new Date(fecha)
.toLocaleString("es-PE");

}


/* ==============================
   INICIAR
============================== */

renderProducts();


/* ==============================
   ACTUALIZAR ADMIN
============================== */

setInterval(()=>{

if(adminToken){

renderAdmin();

}

},8000);

</script>
