<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weyzon Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:800;letter-spacing:.5px}.logo span{color:#3b82f6}
.cart{background:#2563eb;border:0;color:white;padding:10px 15px;border-radius:10px;cursor:pointer}
.hero{padding:55px 7%;background:linear-gradient(135deg,#111827,#2563eb);color:white}
.hero h1{font-size:42px;margin-bottom:10px}.hero p{font-size:18px;opacity:.9}
main{padding:35px 7%}.title{margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 6px 20px #00000012}
.icon{font-size:32px;margin-bottom:10px}.card h3{margin-bottom:8px}.price{font-size:25px;font-weight:800;margin:15px 0}
.buy{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
.buy:hover{background:#1d4ed8}
footer{text-align:center;padding:30px;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:white;border-radius:18px;padding:25px;width:min(430px,100%)}.box h2{margin-bottom:15px}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #d1d5db;border-radius:9px}
.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}
.notice{margin-top:12px;font-size:13px;color:#64748b}
</style>
</head>
<body>

<header>
  <div class="logo">WEYZON <span>STORE</span></div>
  <button class="cart" onclick="showCart()">🛒 Pedido (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Recargas rápidas y seguras</h1>
  <p>Compra tus diamantes de Free Fire de forma sencilla.</p>
</section>

<main>
  <h2 class="title">💎 Diamantes Free Fire</h2>
  <div class="grid" id="products"></div>
</main>

<footer>
  © 2026 Weyzon Store · Todos los derechos reservados
</footer>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" onclick="closeModal()">✕</button>
    <h2>Completar pedido</h2>
    <p id="selected"></p>
    <input id="player" placeholder="ID del jugador">
    <input id="contact" placeholder="WhatsApp o correo">
    <button class="buy" onclick="sendOrder()">Continuar</button>
    <p class="notice">Esta primera versión es una demo: todavía no procesa pagos reales.</p>
  </div>
</div>

<script>
const products=[
["100 💎","S/ 2.60"],["300 💎","S/ 8.00"],["500 💎","S/ 12.50"],
["1,000 💎","S/ 24.00"],["2,000 💎","S/ 44.50"],["6,000 💎","S/ 101.00"]
];
let selected="",count=0;
const container=document.getElementById("products");
products.forEach((p,i)=>{
  container.innerHTML+=`<article class="card">
    <div class="icon">💎</div><h3>${p[0]}</h3><p>Recarga Free Fire</p>
    <div class="price">${p[1]}</div>
    <button class="buy" onclick="openOrder('${p[0]}','${p[1]}')">Comprar</button>
  </article>`;
});
function openOrder(product,price){
 selected=`${product} — ${price}`;
 document.getElementById("selected").innerText="Producto: "+selected;
 document.getElementById("modal").style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function sendOrder(){
 const id=document.getElementById("player").value.trim();
 const contact=document.getElementById("contact").value.trim();
 if(!id||!contact){alert("Completa tu ID y tu contacto.");return}
 count++;document.getElementById("count").innerText=count;
 alert("Pedido registrado como DEMO. Falta conectar el sistema de pago.");
 closeModal();
}
function showCart(){alert(count?`Tienes ${count} pedido(s) en esta demo.`:"Todavía no tienes pedidos.")}
</script>
</body>
</html>
