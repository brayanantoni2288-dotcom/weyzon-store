<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEYZON STORE</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#020205,#06142b,#13030a);
color:#fff;
min-height:100vh
}

header{
text-align:center;
padding:25px 12px;
background:linear-gradient(135deg,#050509,#071a38,#17040a);
border-bottom:2px solid #147cff;
box-shadow:0 0 25px #0066ff55
}

.logo{
font-size:30px;
font-weight:900;
color:#fff;
text-shadow:0 0 12px #1687ff
}

.logo span{color:#1687ff}

header p{
color:#ddd;
margin:8px 0 15px
}

button{
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:bold;
cursor:pointer;
color:white;
background:linear-gradient(135deg,#087cff,#d60035);
box-shadow:0 0 12px #006eff55;
margin:3px
}

button:hover{
transform:scale(1.03)
}

.wrap{
max-width:1100px;
margin:auto;
padding:20px
}

.tabs{
display:flex;
gap:10px;
margin-bottom:15px;
flex-wrap:wrap
}

.tab{
flex:1;
min-width:220px
}

.tab.active{
background:linear-gradient(135deg,#075eff,#ff003c);
box-shadow:0 0 18px #1687ff88
}

.status{
padding:13px;
border-radius:12px;
background:#08172b;
border:1px solid #1687ff;
margin-bottom:18px;
text-align:center
}

.hidden{
display:none!important
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px
}

.card{
background:linear-gradient(145deg,#07111f,#0b0b12);
border:1px solid #126eff;
border-radius:16px;
padding:18px;
text-align:center;
box-shadow:0 0 15px #0066ff25
}

.card:hover{
border-color:#ff174f;
box-shadow:0 0 20px #ff174f35
}

.card.membership{
border-color:#b000ff
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:10px
}

.price{
font-size:25px;
font-weight:900;
color:#20a0ff;
margin:10px
}

.warn{
font-size:12px;
color:#ffd43b;
background:#332b0625;
padding:8px;
border-radius:8px;
margin:10px 0
}

.stock{
font-size:12px;
color:#4dff8a;
margin-bottom:10px
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:20
}

.box{
width:100%;
max-width:450px;
max-height:90vh;
overflow:auto;
background:#080d16;
border:1px solid #1687ff;
border-radius:18px;
padding:20px;
box-shadow:0 0 30px #006eff66
}

.close{
float:right;
background:#ff174f;
padding:7px 11px
}

input{
width:100%;
padding:13px;
margin:7px 0;
border-radius:9px;
border:1px solid #257dff;
background:#02050a;
color:white;
outline:none
}

.order{
background:#0c1522;
border:1px solid #1d4f88;
border-radius:12px;
padding:12px;
margin:10px 0
}

.pending{
color:#ffd43b
}

.done{
color:#4dff8a
}

.notify{
position:fixed;
right:15px;
bottom:15px;
background:#087cff;
padding:13px 17px;
border-radius:12px;
display:none;
z-index:50;
box-shadow:0 0 20px #1687ff88
}

.stat{
display:inline-block;
padding:12px;
margin:5px;
border-radius:10px;
background:#101b2a;
border:1px solid #176dca
}

.adminOrder{
border:1px solid #293e5a;
padding:14px;
border-radius:12px;
margin:10px 0;
background:#09111c
}

.small{
font-size:12px;
color:#aaa
}

@media(max-width:600px){

.logo{
font-size:25px
}

.wrap{
padding:12px
}

.grid{
grid-template-columns:1fr
}

button{
padding:10px 12px
}

}
</style>
</head>

<body>

<header>

<div class="logo">
💎 <span>WEYZON</span> STORE
</div>

<p>
Recarga tus mejores diamantes aquí 🔥
</p>

📋 Mis pedidos
</button>

<button onclick="adminLogin()">

</button>

<button onclick="window.open('https://chat.whatsapp.com/LD7iTrhVber3jX8LUKdwud','_blank')">
💬 Grupo

</header>

<main class="wrap">

<div class="tabs">

<button id="b1"
class="tab active"
onclick="pasarela(1)">
💜 Pasarela 1 · Prexpe
</button>

<button id="b2"
class="tab"
onclick="pasarela(2)">
⚡ Pasarela 2 · Infinitos
</button>

</div>

<div id="info1" class="status">

💜 Pago por Prexpe · Número:
<b>963348614</b>

</div>

<div id="info2" class="status hidden">

⚡ Segunda pasarela · ♾️ Diamantes ilimitados · Cualquier ID

</div>

<div id="productos" class="grid"></div>

</main>

<div id="noti" class="notify"></div>

<div class="box">

<button class="close
