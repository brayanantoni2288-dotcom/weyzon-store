<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEYZON STORE | Recargas Free Fire</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b14;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

header{
  text-align:center;
  padding:30px 10px;
}

.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#00e5ff;
}

.subtitle{
  margin-top:8px;
  color:#aaa;
  font-size:15px;
}

.section{
  margin-top:25px;
}

.section-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.packages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.package{
  background:#111625;
  border:1px solid #20283d;
  border-radius:16px;
  padding:20px 12px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.package:hover{
  transform:translateY(-3px);
  border-color:#00e5ff;
}

.package.selected{
  border:2px solid #00e5ff;
  background:#101d2c;
}

.diamonds{
  font-size:23px;
  font-weight:bold;
}

.price{
  margin-top:8px;
  font-size:20px;
  font-weight:bold;
  color:#00e5ff;
}

.form-box{
  background:#111625;
  border:1px solid #20283d;
  border-radius:18px;
  padding:22px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  color:#ddd;
  font-size:14px;
}

input{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid #30394f;
  background:#080b14;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#00e5ff;
}

.pay-button{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:13px;
  background:#00bfff;
  color:#001018;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.pay-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.back-button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:13px;
  border:1px solid #30394f;
  background:transparent;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.message{
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  display:none;
  text-align:center;
}

.message.success{
  display:block;
  background:#0b3b28;
  color:#7dffbf;
}

.message.error{
  display:block;
  background:#3b1015;
  color:#ff9aa5;
}

.summary{
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  background:#080b14;
  border:1px solid #20283d;
  display:none;
}

.summary div{
  margin:5px 0;
}

footer{
  text-align:center;
  color:#666;
  padding:35px 10px;
  font-size:13px;
}

@media(max-width:700px){
  .packages{
    grid-template-columns:repeat(2,1fr);
  }

  .logo{
    font-size:31px;
  }
}

@media(max-width:400px){
  .packages{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">WEYZON <span>STORE</span></div>
  <div class="subtitle">Recargas Free Fire rápidas y seguras</div>
</header>

<div class="section">

  <div class="section-title">
    💎 Elige tu paquete
  </div>

  <div class="packages">

    <div class="package" data-diamonds="100" data-price="2.70">
      <div class="diamonds">💎 100</div>
      <div class="price">S/ 2.70</div>
    </div>

    <div class="package" data-diamonds="300" data-price="8.00">
      <div class="diamonds">💎 300</div>
      <div class="price">S/ 8.00</div>
    </div>

    <div class="package" data-diamonds="500" data-price="13.20">
      <div class="diamonds">💎 500</div>
      <div class="price">S/ 13.20</div>
    </div>

    <div class="package" data-diamonds="1000" data-price="24.20">
      <div class="diamonds">💎 1000</div>
      <div class="price">S/ 24.20</div>
    </div>

    <div class="package" data-diamonds="2000" data-price="48.60">
      <div class="diamonds">💎 2000</div>
      <div class="price">S/ 48.60</div>
    </div>

    <div class="package" data-diamonds="6000" data-price="121.00">
      <div class="diamonds">💎 6000</div>
      <div class="price">S/ 121.00</div>
    </div>

  </div>
</div>

<div class="section">

  <div class="section-title">
    🎮 Datos de tu cuenta
  </div>

  <div class="form-box">

    <label for="playerId">
      ID de Free Fire
    </label>

    <input
      id="playerId"
      type="text"
      placeholder="Ejemplo: 123456789"
      autocomplete="off"
    >

    <label for="playerName">
      Nombre del jugador
    </label>

    <input
      id="playerName"
      type="text"
      placeholder="Tu nombre en Free Fire"
      autocomplete="off"
    >

    <label for="email">
      Correo electrónico
    </label>

    <input
      id="email"
      type="email"
      placeholder="correo@ejemplo.com"
      autocomplete="email"
    >

    <label for="phone">
      Número de celular Yape
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="111111111"
      maxlength="9"
      autocomplete="off"
    >

    <label for="otp">
      OTP de Yape
    </label>

    <input
      id="otp"
      type="text"
      placeholder="123456"
      maxlength="6"
      inputmode="numeric"
      autocomplete="off"
    >

    <div class="summary" id="summary">
      <div>💎 Paquete: <strong id="summaryDiamonds"></strong></div>
      <div>💰 Precio: <strong id="summaryPrice"></strong></div>
    </div>

    <button
      id="payButton"
      class="pay-button"
      disabled
    >
      💳 PAGAR CON YAPE
    </button>

    <button
      id="backButton"
      class="back-button"
      type="button"
      onclick="window.scrollTo({top:0,behavior:'smooth'})"
    >
      ← VOLVER
    </button>

    <div id="message" class="message"></div>

  </div>
</div>

<footer>
  © 2026 WEYZON STORE
</footer>

</div>

<script>

/* ==============================
   CONFIGURACIÓN
============================== */

const API_URL =
  "https://weyzon-api.brayanantoni2288.workers.dev";

const MP_PUBLIC_KEY =
  "APP_USR-67c84156-de0a-4b6a-abac-a43109017c6b";


/* ==============================
   MERCADO PAGO
============================== */

const mp = new MercadoPago(
  MP_PUBLIC_KEY,
  {
    locale:"es-PE"
  }
);


/* ==============================
   VARIABLES
============================== */

let paqueteSeleccionado = null;
let precioSeleccionado = null;


/* ==============================
   ELEMENTOS
============================== */

const packages =
  document.querySelectorAll(".package");

const payButton =
  document.getElementById("payButton");

const message =
  document.getElementById("message");

const summary =
  document.getElementById("summary");

const summaryDiamonds =
  document.getElementById("summaryDiamonds");

const summaryPrice =
  document.getElementById("summaryPrice");


/* ==============================
   SELECCIONAR PAQUETE
============================== */

packages.forEach((pack)=>{

  pack.addEventListener("click",()=>{

    packages.forEach((p)=>{
      p.classList.remove("selected");
    });

    pack.classList.add("selected");

    paqueteSeleccionado =
      pack.dataset.diamonds;

    precioSeleccionado =
      pack.dataset.price;

    summaryDiamonds.textContent =
      paqueteSeleccionado + " diamantes";

    summaryPrice.textContent =
      "S/ " + precioSeleccionado;

    summary.style.display =
      "block";

    actualizarBoton();

  });

});


/* ==============================
   ACTUALIZAR BOTÓN
============================== */

function actualizarBoton(){

  const playerId =
    document.getElementById("playerId").value.trim();

  const playerName =
    document.getElementById("playerName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const otp =
    document.getElementById("otp").value.trim();

  payButton.disabled =
    !paqueteSeleccionado ||
    !precioSeleccionado ||
    !playerId ||
    !playerName ||
    !email ||
    !phone ||
    !otp;

}


/* ==============================
   ESCUCHAR CAMPOS
============================== */

[
  "playerId",
  "playerName",
  "email",
  "phone",
  "otp"
].forEach((id)=>{

  document
    .getElementById(id)
    .addEventListener("input",()=>{
      actualizarBoton();
    });

});


/* ==============================
   MENSAJE
============================== */

function mostrarMensaje(texto,tipo){

  message.textContent =
    texto;

  message.className =
    "message " + tipo;

}


/* ==============================
   PROCESAR PAGO
============================== */

payButton.addEventListener("click",async()=>{

  try{

    payButton.disabled = true;

    payButton.textContent =
      "⏳ PROCESANDO PAGO...";

    message.className =
      "message";

    const playerId =
      document
        .getElementById("playerId")
        .value
        .trim();

    const playerName =
      document
        .getElementById("playerName")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const otp =
      document
        .getElementById("otp")
        .value
        .trim();


    /* ==========================
       VALIDACIONES
    ========================== */

    if(!paqueteSeleccionado){

      throw new Error(
        "Selecciona un paquete de diamantes."
      );

    }

    if(!playerId){

      throw new Error(
        "Ingresa tu ID de Free Fire."
      );

    }

    if(!playerName){

      throw new Error(
        "Ingresa el nombre del jugador."
      );

    }

    if(!email){

      throw new Error(
        "Ingresa tu correo electrónico."
      );

    }

    if(!phone){

      throw new Error(
        "Ingresa tu número de Yape."
      );

    }

    if(!otp){

      throw new Error(
        "Ingresa el OTP de Yape."
      );

    }


    /* ==========================
       CREAR TOKEN YAPE
    ========================== */

    const yape =
      mp.yape({
        otp:otp,
        phoneNumber:phone
      });


    const yapeToken =
      await yape.create();


    /*
      Mercado Pago puede devolver
      directamente un string o un objeto.

      En caso de objeto usamos .id
    */

    const tokenParaPago =
      typeof yapeToken === "string"
        ? yapeToken
        : yapeToken.id;


    if(!tokenParaPago){

      throw new Error(
        "No se pudo obtener el token de Yape."
      );

    }


    /* ==========================
       ENVIAR AL WORKER
    ========================== */

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            title:
              "Recarga Free Fire - " +
              paqueteSeleccionado +
              " diamantes",

            price:
              Number(precioSeleccionado),

            playerId:
              playerId,

            playerName:
              playerName,

            email:
              email,

            yapeToken:
              tokenParaPago

          })

        }
      );


    const result =
      await response.json();


    /* ==========================
       ERROR DEL WORKER
    ========================== */

    if(!response.ok){

      throw new Error(
        result.error ||
        "Mercado Pago rechazó el pago."
      );

    }


    /* ==========================
       PAGO EXITOSO
    ========================== */

    if(result.ok){

      mostrarMensaje(
        "✅ Pago procesado correctamente. ID: " +
        result.id,
        "success"
      );

      payButton.textContent =
        "✅ PAGO PROCESADO";

      return;

    }


    throw new Error(
      "No se pudo confirmar el pago."
    );


  }catch(error){

    console.error(
      "ERROR PAGO:",
      error
    );

    mostrarMensaje(
      "❌ NO SE PUDO PROCESAR EL PAGO: " +
      (error.message ||
      "Error desconocido."),
      "error"
    );

    payButton.disabled =
      false;

    payButton.textContent =
      "💳 PAGAR CON YAPE";

  }

});


/* ==============================
   INICIO
============================== */

actualizarBoton();

</script>

</body>
</html>
