<div class="cats">
  <button class="cat active" onclick="showCat('diamantes', this)">💎 Diamantes</button>
  <button class="cat" onclick="showCat('membresias', this)">🎫 Membresías</button>
  <button class="cat" onclick="showCat('cajas', this)">📦 Cajas</button>
  <button class="cat" onclick="showCat('pase', this)">🎟️ Pase Booyah</button>
  <button class="cat" onclick="showCat('tarjetas', this)">💳 Tarjetas</button>
</div>

<div id="productos2" class="grid"></div>
<style>
.cats {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 12px 0 18px;
}

.cat {
  white-space: nowrap;
  padding: 12px 18px;
  border-radius: 14px;
  border: 1px solid #168cff;
  background: #081a36;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.cat.active {
  background: linear-gradient(135deg, #168cff, #1555ff);
  box-shadow: 0 0 18px #168cff66;
}

.grid {
  display: grid;
  gap: 18px;
}

.product-image {
  width: 100%;
  height: 250px;
  border-radius: 15px;
  overflow: hidden;
  background: #080d18;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.product-card {
  background: #0a111d;
  border: 1px solid #1d3557;
  border-radius: 20px;
  padding: 14px;
}

.product-card h2 {
  color: white;
}

.product-price {
  color: white;
  font-size: 22px;
  margin: 8px 0;
}
</style>

<script>
const imagenesWeyzon = {
  "Membresía semanal": "membresia-semanal.jpg",
  "Membresía mensual": "membresia-mensual.jpg",
  "30 Cajas": "cajas-evo.jpg",
  "60 Cajas": "cajas-evo.jpg",
  "120 Cajas": "cajas-evo.jpg",
  "Pase Booyah": "pase-booyah.jpg",
  "Tarjeta semanal": "tarjeta-semanal.jpg",
  "Tarjeta mensual": "tarjeta-mensual.jpg"
};

const productosNuevos = [
  {
    cat: "membresias",
    nombre: "Membresía semanal",
    precio: 6.20
  },
  {
    cat: "membresias",
    nombre: "Membresía mensual",
    precio: 31
  },
  {
    cat: "cajas",
    nombre: "30 Cajas",
    precio: 19.90
  },
  {
    cat: "cajas",
    nombre: "60 Cajas",
    precio: 36.50
  },
  {
    cat: "cajas",
    nombre: "120 Cajas",
    precio: 73.50
  },
  {
    cat: "pase",
    nombre: "Pase Booyah",
    precio: 5
  },
  {
    cat: "tarjetas",
    nombre: "Tarjeta semanal",
    precio: 6.50
  },
  {
    cat: "tarjetas",
    nombre: "Tarjeta mensual",
    precio: 31
  }
];

function mostrarProductos(cat) {

  const contenedor = document.getElementById("productos2");

  if (!contenedor) return;

  const productos = productosNuevos.filter(
    producto => producto.cat === cat
  );

  contenedor.innerHTML = "";

  productos.forEach(producto => {

    const tarjeta = document.createElement("div");

    tarjeta.className = "product-card";

    tarjeta.innerHTML = `
      <div class="product-image">
        <img
          src="${imagenesWeyzon[producto.nombre]}"
          alt="${producto.nombre}"
        >
      </div>

      <h2>${producto.nombre}</h2>

      <div class="product-price">
        S/ ${producto.precio.toFixed(2)}
      </div>

      <button type="button">
        Comprar
      </button>
    `;

    const boton = tarjeta.querySelector("button");

    boton.onclick = function() {

      if (typeof abrirPedido === "function") {
        abrirPedido(
          producto.nombre,
          producto.precio,
          2
        );
      }

    };

    contenedor.appendChild(tarjeta);
  });
}

function showCat(cat, boton) {

  document.querySelectorAll(".cat").forEach(
    b => b.classList.remove("active")
  );

  boton.classList.add("active");

  if (cat === "diamantes") {

    const contenedor = document.getElementById("productos2");

    if (contenedor) {
      contenedor.innerHTML = "";
    }

    return;
  }

  mostrarProductos(cat);
}
</script>
