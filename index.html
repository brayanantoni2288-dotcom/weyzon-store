<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WEYZON STORE</title>

  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080c16;
      color: white;
      min-height: 100vh;
    }

    .contenedor {
      width: 92%;
      max-width: 600px;
      margin: auto;
      padding: 30px 0;
    }

    h1 {
      text-align: center;
      color: #00c8ff;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #101625;
      border: 1px solid #273149;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    h2 {
      margin-bottom: 25px;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #ddd;
      font-size: 17px;
    }

    input {
      width: 100%;
      height: 58px;
      padding: 0 18px;
      border-radius: 15px;
      border: 1px solid #303a54;
      background: #070b14;
      color: white;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #00c8ff;
    }

    .paquetes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .paquete {
      padding: 17px 10px;
      border: 2px solid #303a54;
      border-radius: 15px;
      background: #0b101d;
      text-align: center;
      cursor: pointer;
    }

    .paquete.activo {
      border-color: #00c8ff;
      background: #102b38;
    }

    .diamantes {
      font-size: 18px;
      font-weight: bold;
    }

    .precio {
      color: #00c8ff;
      margin-top: 7px;
      font-weight: bold;
    }

    .resumen {
      margin-top: 22px;
      padding: 20px;
      border-radius: 17px;
      background: #080c16;
      border: 1px solid #273149;
    }

    .resumen div {
      margin: 7px 0;
      font-size: 18px;
    }

    .boton {
      width: 100%;
      height: 62px;
      margin-top: 22px;
      border: none;
      border-radius: 17px;
      background: #00b9ef;
      color: #061018;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      background: #555;
      color: #bbb;
      cursor: not-allowed;
    }

    .volver {
      width: 100%;
      height: 60px;
      margin-top: 14px;
      border-radius: 17px;
      border: 1px solid #303a54;
      background: transparent;
      color: white;
      font-size: 18px;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 16px;
      line-height: 1.5;
    }

    .nota {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #555;
      margin-top: 40px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>💎 WEYZON STORE</h1>

  <div class="subtitulo">
    Recargas Free Fire
  </div>

  <div class="card">

    <h2>🎮 Datos de tu cuenta</h2>

    <label>ID de Free Fire</label>
    <input
      id="playerId"
      type="text"
      placeholder="Ingresa tu ID"
    >

    <label>Nombre del jugador</label>
    <input
      id="playerName"
      type="text"
      placeholder="Nombre de tu cuenta"
    >

    <label>Correo electrónico</label>
    <input
      id="email"
      type="email"
      value="testuser123456789@testuser.com"
    >

    <label>Número de celular Yape</label>
    <input
      id="phone"
      type="text"
      inputmode="numeric"
      maxlength="9"
      value="111111111"
    >

    <label>OTP de Yape</label>
    <input
      id="otp"
      type="text"
      inputmode="numeric"
      maxlength="6"
      value="123456"
    >

    <label>💎 Selecciona tu paquete</label>

    <div class="paquetes">

      <div class="paquete activo"
           data-diamantes="100"
           data-precio="2.70">
        <div class="diamantes">💎 100</div>
        <div class="precio">S/ 2.70</div>
      </div>

      <div class="paquete"
           data-diamantes="300"
           data-precio="8.00">
        <div class="diamantes">💎 300</div>
        <div class="precio">S/ 8.00</div>
      </div>

      <div class="paquete"
           data-diamantes="500"
           data-precio="13.20">
        <div class="diamantes">💎 500</div>
        <div class="precio">S/ 13.20</div>
      </div>

      <div class="paquete"
           data-diamantes="1000"
           data-precio="24.20">
        <div class="diamantes">💎 1000</div>
        <div class="precio">S/ 24.20</div>
      </div>

      <div class="paquete"
           data-diamantes="2000"
           data-precio="48.60">
        <div class="diamantes">💎 2000</div>
        <div class="precio">S/ 48.60</div>
      </div>

      <div class="paquete"
           data-diamantes="6000"
           data-precio="121.00">
        <div class="diamantes">💎 6000</div>
        <div class="precio">S/ 121.00</div>
      </div>

    </div>

    <div class="resumen">
      <div>
        💎 Paquete:
        <strong id="resumenDiamantes">100 diamantes</strong>
      </div>

      <div>
        💰 Precio:
        <strong id="resumenPrecio">S/ 2.70</strong>
      </div>
    </div>

    <button class="boton" id="btnPagar">
      💳 PAGAR CON YAPE
    </button>

    <button class="volver" onclick="history.back()">
      ← VOLVER
    </button>

    <div id="resultado"></div>

    <div class="nota">
      🧪 Modo de prueba de Mercado Pago
    </div>

  </div>

  <footer>
    © 2026 WEYZON STORE
  </footer>

</div>

<script>

  /* =====================================
     API
  ===================================== */

  const API_URL =
    "https://weyzon-api.brayanantoni2288.workers.dev";


  /* =====================================
     CREDENCIAL DE PRUEBA
  ===================================== */

  const MP_PUBLIC_KEY =
    "TEST-ded7f9e5-e5a9-4ed3-97a6-73584ba87df1";


  const mp =
    new MercadoPago(
      MP_PUBLIC_KEY,
      {
        locale: "es-PE"
      }
    );


  /* =====================================
     VARIABLES
  ===================================== */

  let paqueteSeleccionado = "100";
  let precioSeleccionado = "2.70";


  /* =====================================
     SELECCIÓN DE PAQUETE
  ===================================== */

  document
    .querySelectorAll(".paquete")
    .forEach(paquete => {

      paquete.addEventListener("click", function() {

        document
          .querySelectorAll(".paquete")
          .forEach(p => {
            p.classList.remove("activo");
          });

        this.classList.add("activo");

        paqueteSeleccionado =
          this.dataset.diamantes;

        precioSeleccionado =
          this.dataset.precio;

        document
          .getElementById("resumenDiamantes")
          .textContent =
          paqueteSeleccionado +
          " diamantes";

        document
          .getElementById("resumenPrecio")
          .textContent =
          "S/ " +
          precioSeleccionado;

      });

    });


  /* =====================================
     MOSTRAR RESULTADO
  ===================================== */

  function mostrarResultado(
    mensaje,
    correcto = false
  ) {

    const caja =
      document.getElementById("resultado");

    caja.style.display = "block";

    caja.style.background =
      correcto
        ? "#0c3920"
        : "#451018";

    caja.style.color =
      correcto
        ? "#8cffad"
        : "#ff9aa8";

    caja.textContent =
      mensaje;

  }


  /* =====================================
     PAGAR
  ===================================== */

  document
    .getElementById("btnPagar")
    .addEventListener(
      "click",
      procesarPago
    );


  async function procesarPago() {

    const boton =
      document.getElementById("btnPagar");


    const playerId =
      document
        .getElementById("playerId")
        .value
        .trim();


    const playerName =
      document
        .getElementById("playerName")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    const otp =
      document
        .getElementById("otp")
        .value
        .trim();


    /* =====================================
       VALIDACIONES
    ===================================== */

    if (!playerId) {
      mostrarResultado(
        "❌ Ingresa tu ID de Free Fire."
      );
      return;
    }


    if (!playerName) {
      mostrarResultado(
        "❌ Ingresa el nombre del jugador."
      );
      return;
    }


    if (!email) {
      mostrarResultado(
        "❌ Ingresa un correo."
      );
      return;
    }


    if (!/^[0-9]{9}$/.test(phone)) {
      mostrarResultado(
        "❌ El número de Yape debe tener 9 dígitos."
      );
      return;
    }


    if (!/^[0-9]{6}$/.test(otp)) {
      mostrarResultado(
        "❌ El OTP debe tener 6 dígitos."
      );
      return;
    }


    boton.disabled = true;

    boton.textContent =
      "⏳ PROCESANDO...";


    try {

      /* =====================================
         TOKEN YAPE
      ===================================== */

      const yape =
        mp.yape({
          otp: otp,
          phoneNumber: phone
        });


      const respuestaYape =
        await yape.create();


      console.log(
        "TOKEN YAPE:",
        respuestaYape
      );


      let yapeToken;


      if (
        typeof respuestaYape === "string"
      ) {

        yapeToken =
          respuestaYape;

      } else if (
        respuestaYape &&
        respuestaYape.id
      ) {

        yapeToken =
          respuestaYape.id;

      }


      if (!yapeToken) {

        throw new Error(
          "No se pudo obtener el token de Yape."
        );

      }


      /* =====================================
         ENVIAR AL WORKER
      ===================================== */

      const respuesta =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              title:
                "Recarga Free Fire - " +
                paqueteSeleccionado +
                " diamantes",

              price:
                Number(
                  precioSeleccionado
                ),

              playerId:
                playerId,

              playerName:
                playerName,

              email:
                email,

              yapeToken:
                yapeToken

            })
          }
        );


      const texto =
        await respuesta.text();


      let datos;


      try {

        datos =
          JSON.parse(texto);

      } catch {

        datos = {
          error: texto
        };

      }


      console.log(
        "RESPUESTA WORKER:",
        datos
      );


      /* =====================================
         ERROR
      ===================================== */

      if (!respuesta.ok) {

        let mensaje =
          datos.message ||
          datos.error ||
          "No se pudo procesar el pago.";


        if (datos.status) {

          mensaje +=
            "\n\nStatus: " +
            datos.status;

        }


        if (datos.status_detail) {

          mensaje +=
            "\nDetalle: " +
            datos.status_detail;

        }


        if (datos.cause) {

          mensaje +=
            "\n\nCausa:\n" +
            JSON.stringify(
              datos.cause,
              null,
              2
            );

        }


        throw new Error(
          mensaje
        );

      }


      /* =====================================
         APROBADO
      ===================================== */

      mostrarResultado(

        "✅ PAGO APROBADO\n\n" +

        "💎 Diamantes: " +
        paqueteSeleccionado +

        "\n💰 Precio: S/ " +
        precioSeleccionado +

        "\n🆔 ID Free Fire: " +
        playerId +

        "\n👤 Jugador: " +
        playerName,

        true

      );


    } catch (error) {

      console.error(
        "ERROR:",
        error
      );


      mostrarResultado(

        "❌ NO SE PUDO PROCESAR EL PAGO:\n\n" +
        error.message

      );

    } finally {

      boton.disabled = false;

      boton.textContent =
        "💳 PAGAR CON YAPE";

    }

  }

</script>

</body>
</html>
